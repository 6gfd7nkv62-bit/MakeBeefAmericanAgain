<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make Beef American Again</title>
<meta name="description" content="Promoting American beef and the ranchers who raise it.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f2f2f2;font-family:Arial,Helvetica,sans-serif;
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px}
.wrap{max-width:660px;text-align:center}
h1{font-size:clamp(30px,8vw,58px);line-height:1.05;letter-spacing:-1px;text-transform:uppercase}
h1 span{color:#c8102e}
.bar{width:76px;height:5px;background:#c8102e;margin:26px auto}
p.sub{font-size:clamp(15px,4vw,20px);color:#b9b9b9;line-height:1.6;margin-bottom:30px}
.soon{display:inline-block;border:2px solid #c8102e;border-radius:60px;padding:12px 30px;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#c8102e}
a{color:#c8102e}
</style>
</head>
<body>
<div class="wrap">
<h1>Make <span>Beef</span> American Again</h1>
<div class="bar"></div>
<p class="sub">Promoting American beef, and the ranchers who raise it.</p>
<div class="soon">Launching Soon</div>
</div>
</body>
</html>
